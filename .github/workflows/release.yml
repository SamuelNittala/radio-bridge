name: Release

# Pushing a tag like v0.1.0 builds the universal app, runs the tests and
# publishes a GitHub release with the zip attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build and zip
        run: ./release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/RadioBridge-${GITHUB_REF_NAME#v}.zip" \
            --title "Radio Bridge ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
